name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    name: ${{ matrix.compiler }} ${{ matrix.build_type }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [g++, clang++]
        build_type: [Release, Debug]
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DCMAKE_CXX_COMPILER=${{ matrix.compiler }}
      - name: Build
        run: cmake --build build -j 4
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Smoke test the tools (generate + replay, single and threaded)
        run: |
          ./build/lob_gen --out feed.bin --seed 42 --count 200000
          ./build/lob_replay feed.bin
          ./build/lob_replay feed.bin --threaded

  asan-ubsan:
    name: ASan + UBSan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Work around ASan/TSan "unexpected memory mapping" on newer kernels.
      - run: sudo sysctl vm.mmap_rnd_bits=28
      - name: Configure
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DLOB_SANITIZE=address,undefined
      - run: cmake --build build -j 4
      - name: Test
        run: ctest --test-dir build --output-on-failure

  tsan:
    name: ThreadSanitizer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo sysctl vm.mmap_rnd_bits=28
      - name: Configure
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DLOB_SANITIZE=thread
      - run: cmake --build build -j 4
      - name: Test
        run: ctest --test-dir build --output-on-failure

  benchmark:
    name: Benchmarks (ubuntu-latest, shared runner)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          -DLOB_BUILD_BENCH=ON -DLOB_BUILD_TESTS=OFF -DLOB_BUILD_TOOLS=OFF
      - run: cmake --build build -j 4
      - name: Machine info
        run: |
          nproc
          lscpu | grep -E "Model name|^CPU\(s\)|MHz" || true
          g++ --version | head -1
      - name: Run
        run: >
          ./build/bench/lob_bench
          --benchmark_repetitions=5
          --benchmark_report_aggregates_only=true
          --benchmark_out=bench_results.json
          --benchmark_out_format=json
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: bench_results.json

  wasm:
    name: WebAssembly build + Node smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.74
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Configure
        run: >
          emcmake cmake -S . -B build-wasm -DCMAKE_BUILD_TYPE=Release
          -DLOB_BUILD_WASM=ON -DLOB_BUILD_TESTS=OFF -DLOB_BUILD_TOOLS=OFF
      - run: cmake --build build-wasm -j 4
      - name: Smoke test
        run: node wasm/smoke_test.js build-wasm/wasm_out/lob.js
